name: Trigger auto deployment for agent42

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - 'src/services/agent42/**'
    - 'infra/legacy-workflows/agent42.yml'

  # Allow manual trigger 
  workflow_dispatch:      

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v6

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AGENT42_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AGENT42_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AGENT42_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/src/services/agent42
          dockerfilePath: Dockerfile
          registryUrl: lab530.azurecr.io
          registryUsername: ${{ secrets.AGENT42_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AGENT42_REGISTRY_PASSWORD }}
          containerAppName: agent42
          resourceGroup: lab530_RG
          imageToBuild: lab530.azurecr.io/agent42:${{ github.sha }}