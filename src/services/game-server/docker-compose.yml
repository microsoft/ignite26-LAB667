# Three independent services. Scale each one independently, e.g.:
#
#   docker compose up -d
#   docker compose up -d --scale mcp=3 --scale dashboard=2
#
# Behind a load balancer (nginx, Traefik, Azure Front Door, etc.) you can route
# /<slug>/mcp -> mcp, /<slug>/dashboard* -> dashboard, / -> admin.

services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: lost-in-the-city/mcp
    command: ["python", "server.py"]
    env_file: .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: lost-in-the-city/dashboard
    command: ["python", "dashboard.py"]
    env_file: .env
    environment:
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "8090"
    ports:
      - "8090:8090"
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    image: lost-in-the-city/admin
    command: ["python", "admin.py"]
    env_file: .env
    environment:
      ADMIN_PORT: "8080"
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_DEVELOPMENT_MODE: ${ADMIN_DEVELOPMENT_MODE:-true}
      # Public URLs the admin UI advertises to the operator. Override these
      # to whatever the browser can reach (e.g. https://mcp.example.com).
      GAME_SERVER_URL: ${GAME_SERVER_URL:-http://localhost:8000}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:8090}
    ports:
      - "8080:8080"
    restart: unless-stopped
